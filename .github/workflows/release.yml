name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        shell: bash
        run: |
          set -euo pipefail
          zip -r "kmb-face-${GITHUB_REF_NAME}.zip" \
            manifest.json \
            src \
            lib \
            popup.html \
            LICENSE \
            README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: kmb-face-${{ github.ref_name }}.zip
          generate_release_notes: true
